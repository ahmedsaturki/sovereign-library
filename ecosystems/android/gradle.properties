# Sovereign Android — gradle.properties (checked in, applies to every contributor)
#
# Kept minimal and conservative. Anything that risks breaking the Android
# library build on a first-time contributor is intentionally NOT enabled here
# (e.g. org.gradle.configuration-cache, which AGP only supports from 8.5+
# for some plugins and is known to break the first build under certain
# annotation-processor combinations).
#
# When raising the AGP version, revisit configuration-cache and parallel
# execution in a follow-up commit and document the result in the audit
# record (docs/HARDENING_FINDINGS_V1.0.md).

# JVM
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Build cache (CI uses gradle/actions/setup-gradle@v4 which will populate
# and reuse ~/.gradle/caches via the implicit Gradle home cache; this flag
# keeps local builds consistent).
org.gradle.caching=true

# Parallel project execution — safe for this repo (no annotation-processor
# cross-project state observed).
org.gradle.parallel=true

# Capture reproducible file timestamps. Combined with the
# `reproducible-build` work in the workflow, this is what makes the AAR
# bit-identical between runs (after stripping the SOURCE_DATE_EPOCH effect
# from the VFS).
org.gradle.vfs.watch=false

# Kotlin
kotlin.code.style=official

# AndroidX (already required by AGP 8.5; declared explicitly so a downgrade
# attempt is loud). Jetifier remains enabled defensively for legacy
# transitive deps (see ecosystems/android/build.gradle / CI evidence).
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=true