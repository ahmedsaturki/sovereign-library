# Dependabot auto-merge policy — fail closed
#
# This workflow is intentionally API-only. It never executes code from the
# Dependabot PR, never checks out the PR branch, and never falls back to a
# direct merge when native auto-merge is unavailable.
#
# A Dependabot PR is eligible only when ALL gates pass:
#   1. author is dependabot[bot];
#   2. at least one concrete semver change is detected from X to Y;
#   3. every detected dependency update is PATCH-only (same major + minor,
#      higher patch);
#   4. required checks "verify" and "security-pipeline" are present and green;
#   5. no hold/do-not-merge/breaking label is present;
#   6. no unresolved review thread exists;
#   7. no frozen Cube path is touched;
#   8. the PR is not draft.
#
# Any uncertainty => STOP. No direct merge and no policy bypass.

name: dependabot-auto-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read
  issues: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-merge safe Dependabot patch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.draft == false
    steps:
      - name: Evaluate semver policy
        id: semver
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          python - "$PR_BODY" > /tmp/semver.json <<'PY'
          import json
          import re
          import sys

          body = sys.argv[1] if len(sys.argv) > 1 else ""
          pattern = re.compile(
              r"\bfrom\s+v?(\d+)\.(\d+)\.(\d+)\s+to\s+v?(\d+)\.(\d+)\.(\d+)\b",
              re.IGNORECASE,
          )
          changes = []
          for match in pattern.finditer(body):
              f1, f2, f3, t1, t2, t3 = map(int, match.groups())
              changes.append((f1, f2, f3, t1, t2, t3))

          if not changes:
              print(json.dumps({"eligible": False, "reason": "no parseable semver update"}))
              raise SystemExit(0)

          patch_only = all(
              t1 == f1 and t2 == f2 and t3 > f3
              for f1, f2, f3, t1, t2, t3 in changes
          )
          reason = "patch-only semver updates" if patch_only else "non-patch semver update requires human review"
          print(json.dumps({"eligible": patch_only, "reason": reason, "count": len(changes)}))
          PY
          eligible="$(python -c 'import json; print(str(json.load(open("/tmp/semver.json"))["eligible"]).lower())')"
          reason="$(python -c 'import json; print(json.load(open("/tmp/semver.json"))["reason"])')"
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Fetch changed paths and labels
        id: metadata
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename' > /tmp/touched.txt
          gh api "repos/$REPO/issues/$PR_NUMBER" --jq '.labels[].name' | sort -u > /tmp/labels.txt
          echo "touched_count=$(wc -l < /tmp/touched.txt)" >> "$GITHUB_OUTPUT"

      - name: Evaluate governance policy
        id: policy
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SEMVER_ELIGIBLE: ${{ steps.semver.outputs.eligible }}
          SEMVER_REASON: ${{ steps.semver.outputs.reason }}
        run: |
          set -euo pipefail

          deny_labels=(
            "do-not-merge"
            "hold"
            "breaking"
          )
          for label in "${deny_labels[@]}"; do
            if grep -Fxq "$label" /tmp/labels.txt; then
              echo "blocked: forbidden label $label"
              exit 1
            fi
          done

          frozen_paths=(
            "cubes/application-lifecycle/"
            "cubes/process-supervisor/"
            "cubes/filesystem-recovery-journal/"
            "cubes/safe-file-quarantine-delete/"
            "cubes/bounded-file-content-reader-safe-content-access/"
            "cubes/filesystem-permission-ownership-descriptor-v0-1/"
            "cubes/atomic-batch-file-transaction-safe-multi-file-commit/"
            "cubes/file-lease-advisory-lock/"
          )
          for path_prefix in "${frozen_paths[@]}"; do
            if grep -Fq "$path_prefix" /tmp/touched.txt; then
              echo "blocked: frozen path touched: $path_prefix"
              exit 1
            fi
          done

          if [ "$SEMVER_ELIGIBLE" != "true" ]; then
            echo "blocked: $SEMVER_REASON"
            exit 1
          fi

          echo "policy=eligible" >> "$GITHUB_OUTPUT"

      - name: Check unresolved review threads
        id: reviews
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          query='query($owner:String!,$repo:String!,$number:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$number){reviewThreads(first:100){nodes{isResolved}}}}}'
          unresolved="$(gh api graphql             -f query="$query"             -F owner="$OWNER"             -F repo="$REPO_NAME"             -F number="$PR_NUMBER"             --jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')"
          if [ "$unresolved" -ne 0 ]; then
            echo "blocked: $unresolved unresolved review thread(s)"
            exit 1
          fi
          echo "unresolved=0" >> "$GITHUB_OUTPUT"

      - name: Wait for required CI
        id: checks
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          required=("verify" "security-pipeline")
          deadline=$(($(date +%s) + 600))

          while [ "$(date +%s)" -lt "$deadline" ]; do
            mapfile -t check_rows < <(
              gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?per_page=100"                 --jq '.check_runs[] | [.name, (.conclusion // ""), (.status // "")] | @tsv'
            )

            all_green=1
            for required_name in "${required[@]}"; do
              found=0
              for row in "${check_rows[@]}"; do
                IFS=$'\t' read -r name conclusion status <<< "$row"
                if [ "$name" = "$required_name" ]; then
                  found=1
                  if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
                    all_green=0
                  fi
                  break
                fi
              done
              if [ "$found" -ne 1 ]; then
                all_green=0
              fi
            done

            if [ "$all_green" -eq 1 ]; then
              echo "required_checks=green" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done

          echo "blocked: required CI did not reach green within 10 minutes"
          exit 1

      - name: Enable native GitHub auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --auto --squash
