name: dependabot-auto-merge

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: write
  checks: read
  issues: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Safe Dependabot patch auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.draft == false
    steps:
      - name: Fetch PR metadata
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - "${PR_BODY:-}" > "${RUNNER_TEMP}/semver.json" <<'PY'
          import json
          import re
          import sys

          body = sys.argv[1] if len(sys.argv) > 1 else ""
          versions = [
              tuple(map(int, m))
              for m in re.findall(
                  r"\bfrom\s+v?(\d+)\.(\d+)\.(\d+)\s+to\s+v?(\d+)\.(\d+)\.(\d+)\b",
                  body,
                  re.IGNORECASE,
              )
          ]

          updates = []
          for i in range(0, len(versions), 2):
              if i + 1 < len(versions):
                  updates.append((*versions[i], *versions[i + 1]))

          eligible = bool(updates) and all(
              t_major == f_major
              and t_minor == f_minor
              and t_patch > f_patch
              for f_major, f_minor, f_patch, t_major, t_minor, t_patch in updates
          )

          print(json.dumps({"eligible": eligible, "updates": len(updates)}))
          PY

          python3 - "${RUNNER_TEMP}/semver.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          if not data["eligible"]:
              raise SystemExit("blocked: PR is not a strict patch-only semver update")
          PY

          gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename' > "${RUNNER_TEMP}/touched.txt"
          gh api "repos/${REPO}/issues/${PR_NUMBER}" --jq '.labels[].name' | sort -u > "${RUNNER_TEMP}/labels.txt"

          forbidden_labels="do-not-merge hold breaking"
          for label in $forbidden_labels; do
            if grep -Fxq "$label" "${RUNNER_TEMP}/labels.txt"; then
              echo "blocked: forbidden label $label"
              exit 1
            fi
          done

          frozen_paths="
          cubes/application-lifecycle/
          cubes/process-supervisor/
          cubes/filesystem-recovery-journal/
          cubes/safe-file-quarantine-delete/
          cubes/bounded-file-content-reader-safe-content-access/
          cubes/filesystem-permission-ownership-descriptor-v0-1/
          cubes/atomic-batch-file-transaction-safe-multi-file-commit/
          cubes/file-lease-advisory-lock/
          "

          while IFS= read -r prefix; do
            [ -n "$prefix" ] || continue
            if grep -Fq "$prefix" "${RUNNER_TEMP}/touched.txt"; then
              echo "blocked: frozen path touched: $prefix"
              exit 1
            fi
          done <<< "$frozen_paths"

          echo "policy=passed"

      - name: Verify required checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh pr checks "${PR_NUMBER}" --required

      - name: Enable native GitHub auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh pr merge "${PR_NUMBER}" --auto --squash
