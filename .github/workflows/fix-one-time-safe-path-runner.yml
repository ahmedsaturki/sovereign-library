name: fix-one-time-safe-path-runner

on:
  push:
    branches: [feat/continuity-hardening]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate on migration marker
        run: test -f .automation/safe-path-dependency-wave

      - name: Repair helper matching logic
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/one-time-safe-path-dependency-wave.yml')
          text = p.read_text(encoding='utf-8')
          old = '''          for slug, _ in candidates:\n              spec = catalog.get(slug)\n              if not spec:\n                  raise SystemExit(f"catalog entry missing: {slug}")\n              spec["name"] = f"@sovereign/{slug}"\n              spec["packageDir"] = f"packages/{slug}"\n              spec["version"] = version\n              spec["status"] = "TECHNICALLY_READY"\n              spec["reason"] = "packaged, explicit safe-path-resolver dependency, declaration-exact, out-of-tree verified"\n'''
          new = '''          for slug, source in candidates:\n              spec = next((item for item in catalog.values() if item.get("source") == source), None)\n              if not spec:\n                  raise SystemExit(f"catalog source entry missing: {source}")\n              spec["name"] = f"@sovereign/{slug}"\n              spec["packageDir"] = f"packages/{slug}"\n              spec["version"] = version\n              spec["status"] = "TECHNICALLY_READY"\n              spec["reason"] = "packaged, explicit safe-path-resolver dependency, declaration-exact, out-of-tree verified"\n'''
          if old not in text:
              raise SystemExit('expected catalog promotion block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Self-delete repair helper and marker
        run: |
          rm -f .github/workflows/fix-one-time-safe-path-runner.yml
          rm -f .automation/safe-path-dependency-wave
          rmdir .automation 2>/dev/null || true

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: resolve catalog entries by source path"
          git push origin feat/continuity-hardening
