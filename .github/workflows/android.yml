name: android

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "ecosystems/android/**"
      - ".github/workflows/android.yml"
      - "contracts/conformance/**"
  pull_request:
    branches: [main]
    paths:
      - "ecosystems/android/**"
      - ".github/workflows/android.yml"
      - "contracts/conformance/**"

jobs:
  android:
    name: Android ${{ matrix.os }} / AGP 8.5 / JDK 17
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    defaults:
      run:
        working-directory: ecosystems/android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install build tools
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34" || true

      - name: Run unit tests + conformance (JVM-hosted)
        run: gradle test --no-daemon --console=plain

      - name: Build Android library artifacts (AAR)
        run: gradle assembleRelease --no-daemon --console=plain

      - name: Verify reproducible AAR
        shell: bash
        run: |
          rm -rf safe-path-resolver/build
          gradle assembleRelease --no-daemon --console=plain
          AAR=$(find safe-path-resolver/build -name "*.aar" | head -1)
          mkdir -p /tmp/aar1 && cp "$AAR" /tmp/aar1/
          rm -rf safe-path-resolver/build
          gradle assembleRelease --no-daemon --console=plain
          mkdir -p /tmp/aar2 && cp "$(find safe-path-resolver/build -name '*.aar' | head -1)" /tmp/aar2/
          diff <(sha256sum /tmp/aar1/*.aar | awk '{print $1}') \
               <(sha256sum /tmp/aar2/*.aar | awk '{print $1}') \
            && echo "REPRODUCIBLE OK"

      - name: Upload AAR artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: android-aars
          path: |
            ecosystems/android/safe-path-resolver/build/outputs/aar/*.aar
          if-no-files-found: error
