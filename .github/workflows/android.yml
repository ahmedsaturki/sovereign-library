name: android

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "ecosystems/android/**"
      - ".github/workflows/android.yml"
      - "contracts/conformance/**"
  pull_request:
    branches: [main]
    paths:
      - "ecosystems/android/**"
      - ".github/workflows/android.yml"
      - "contracts/conformance/**"

jobs:
  android:
    name: Android ${{ matrix.os }} / AGP 8.5 / JDK 17
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    defaults:
      run:
        working-directory: ecosystems/android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source revision
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "Expected source revision: $expected"
          echo "Actual source revision:   $actual"
          test "$actual" = "$expected"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Install Android emulator image
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sdkmanager "emulator" "system-images;android-34;google_apis;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Run unit tests + conformance (JVM-hosted)
        run: ./gradlew test --no-daemon --console=plain
        shell: bash

      - name: Build Android library artifacts (AAR)
        run: ./gradlew assembleRelease --no-daemon --console=plain
        shell: bash

      - name: Verify reproducible AAR
        shell: bash
        run: |
          rm -rf safe-path-resolver/build
          ./gradlew assembleRelease --no-daemon --console=plain
          AAR=$(find safe-path-resolver/build -name "*.aar" | head -1)
          test -n "$AAR"
          mkdir -p /tmp/aar1
          cp "$AAR" /tmp/aar1/
          rm -rf safe-path-resolver/build
          ./gradlew assembleRelease --no-daemon --console=plain
          AAR2=$(find safe-path-resolver/build -name '*.aar' | head -1)
          test -n "$AAR2"
          mkdir -p /tmp/aar2
          cp "$AAR2" /tmp/aar2/
          diff <(sha256sum /tmp/aar1/*.aar | awk '{print $1}') \
               <(sha256sum /tmp/aar2/*.aar | awk '{print $1}') \
            && echo "REPRODUCIBLE OK"

      - name: Run instrumentation tests on Android emulator
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -Eeuo pipefail
          AVD_HOME="$RUNNER_TEMP/android-avd"
          rm -rf "$AVD_HOME"
          mkdir -p "$AVD_HOME"
          export ANDROID_AVD_HOME="$AVD_HOME"
          echo "no" | avdmanager create avd \
            --name sovereign-android-api34 \
            --package "system-images;android-34;google_apis;x86_64" \
            --device "pixel_2" \
            --force
          nohup emulator \
            -avd sovereign-android-api34 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -gpu swiftshader_indirect \
            >/tmp/sovereign-emulator.log 2>&1 &
          adb wait-for-device
          for _ in $(seq 1 90); do
            if adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$'; then
              break
            fi
            sleep 2
          done
          adb shell getprop sys.boot_completed | tr -d '\r' | grep -q '^1$'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          ./gradlew :safe-path-resolver:connectedDebugAndroidTest --no-daemon --console=plain

      - name: Upload AAR artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: android-aars
          path: |
            ecosystems/android/safe-path-resolver/build/outputs/aar/*.aar
          if-no-files-found: error