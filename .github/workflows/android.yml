name: android

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "ecosystems/android/**"
      - ".github/workflows/android.yml"
      - "contracts/conformance/**"
  pull_request:
    branches: [main]
    paths:
      - "ecosystems/android/**"
      - ".github/workflows/android.yml"
      - "contracts/conformance/**"

jobs:
  android:
    name: Android ${{ matrix.os }} / AGP 8.5 / JDK 17
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    defaults:
      run:
        working-directory: ecosystems/android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source revision
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "Expected source revision: $expected"
          echo "Actual source revision:   $actual"
          test "$actual" = "$expected"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Run unit tests + conformance (JVM-hosted)
        run: ./gradlew test --no-daemon --console=plain
        shell: bash

      - name: Build Android library artifacts (AAR)
        run: ./gradlew assembleRelease --no-daemon --console=plain
        shell: bash

      - name: Verify reproducible AAR
        shell: bash
        run: |
          rm -rf safe-path-resolver/build
          ./gradlew assembleRelease --no-daemon --console=plain
          AAR=$(find safe-path-resolver/build -name "*.aar" | head -1)
          mkdir -p /tmp/aar1 && cp "$AAR" /tmp/aar1/
          rm -rf safe-path-resolver/build
          ./gradlew assembleRelease --no-daemon --console=plain
          mkdir -p /tmp/aar2 && cp "$(find safe-path-resolver/build -name '*.aar' | head -1)" /tmp/aar2/
          diff <(sha256sum /tmp/aar1/*.aar | awk '{print $1}') \
               <(sha256sum /tmp/aar2/*.aar | awk '{print $1}') \
            && echo "REPRODUCIBLE OK"

      - name: Upload AAR artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: android-aars
          path: |
            ecosystems/android/safe-path-resolver/build/outputs/aar/*.aar
          if-no-files-found: error