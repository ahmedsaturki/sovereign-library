name: android

# Sovereign Library — Android CI
#
# Strategy
#   * Unit tests + JVM-hosted conformance: Ubuntu / macOS / Windows.
#   * AAR assembly + out-of-tree consumer + reproducibility: Ubuntu / macOS / Windows.
#   * Android instrumentation tests (KVM/HAXM-backed emulator):
#       - Windows (KVM unavailable; x86_64 + swiftshader is reliable on Windows).
#       - macOS (HVF-backed x86_64, fast).
#   * The original "only Windows" gating was hardened to keep Linux/macOS builds green
#     while still instrumenting ART in a real emulator (Windows + macOS).
#
# Toolchain pin (verified against documented support matrix)
#   * Android Gradle Plugin 8.5.x — Gradle 8.7+ (we pin 8.9), JDK 17.
#   * Kotlin 1.9.22 — AndroidX-friendly, JDK 17.
#   * compileSdk = 34, targetSdk = 34, minSdk = 23 (CI emulator API-34 supports 23).
#   * AndroidX test runner 1.6.2, Jetifier enabled (defensive for legacy libs).
#   * cmdline-tools version 12266719 (== 16.0.0) — same major GitHub runners ship.

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "ecosystems/android/**"
      - ".github/workflows/android.yml"
      - "contracts/conformance/**"
      - ".github/scripts/**"
  pull_request:
    branches: [main, "feat/**"]
    paths:
      - "ecosystems/android/**"
      - ".github/workflows/android.yml"
      - "contracts/conformance/**"
      - ".github/scripts/**"

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android ${{ matrix.os }} / AGP 8.5 / JDK 17
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted runners — `macos-15-intel` is the deprecated x86_64 macOS
        # runner image and has been working with preinstalled cmdline-tools since
        # 2025. If/when GitHub retires it we will switch to `macos-14`.
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    defaults:
      run:
        working-directory: ecosystems/android

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact source revision
        shell: bash
        run: |
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          echo "Expected source revision: $expected"
          echo "Actual source revision:   $actual"
          test "$actual" = "$expected"

      - name: Set up JDK 17
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (Linux/Windows)
        if: matrix.os != 'macos-15-intel'
        uses: android-actions/setup-android@13f81365a437096ca29f87b1e7389bf0ea1385ed # v3.0.0
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Set up Android SDK (macOS preinstalled)
        if: matrix.os == 'macos-15-intel'
        uses: android-actions/setup-android@13f81365a437096ca29f87b1e7389bf0ea1385ed # v3.0.0
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Verify macOS preinstalled Android SDK
        if: matrix.os == 'macos-15-intel'
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          test -d "$SDK"
          test -x "$SDK/platform-tools/adb"
          test -d "$SDK/platforms/android-34"
          test -x "$SDK/emulator/emulator"
          test -d "$SDK/cmdline-tools"
          echo "Using preinstalled Android SDK: $SDK"
          "$SDK/platform-tools/adb" version
          test -n "$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d -print -quit)"

      - name: Add Windows SDK tools to PATH (before avdmanager)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          echo "C:\Android\android-sdk\tools" >> $GITHUB_PATH
          echo "C:\Android\android-sdk\tools\bin" >> $GITHUB_PATH

      - name: Install Android emulator image (x86_64 for Windows) - use full path to sdkmanager
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          "C:\Android\android-sdk\cmdline-tools\16.0\bin\sdkmanager.bat" "emulator" "system-images;android-34;google_apis;x86_64"

      - name: Add emulator to PATH (ubuntu-latest)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
        with:
          gradle-version: wrapper

      - name: Run unit tests + conformance (JVM-hosted)
        run: ./gradlew test --no-daemon --console=plain
        shell: bash

      - name: Build Android library artifacts (AAR)
        run: ./gradlew assembleRelease --no-daemon --console=plain
        shell: bash

      - name: Verify packaged AAR out-of-tree
        shell: bash
        run: |
          set -Eeuo pipefail
          AAR=$(find safe-path-resolver/build/outputs/aar -name '*.aar' | head -1)
          test -n "$AAR"
          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT
          mkdir -p "$TMP_DIR/lib"
          unzip -q "$AAR" classes.jar -d "$TMP_DIR"
          cp "$TMP_DIR/classes.jar" "$TMP_DIR/lib/classes.jar"
          CACHE_ROOT="${GRADLE_USER_HOME:-$HOME/.gradle}"
          STDLIB=$(find "$CACHE_ROOT" -path '*/org.jetbrains.kotlin/kotlin-stdlib/*/kotlin-stdlib-*.jar' -print -quit 2>/dev/null || true)
          if [ -z "$STDLIB" ] && [ "$CACHE_ROOT" != "$HOME/.gradle" ]; then
            STDLIB=$(find "$HOME/.gradle" -path '*/org.jetbrains.kotlin/kotlin-stdlib/*/kotlin-stdlib-*.jar' -print -quit 2>/dev/null || true)
          fi
          if [ -z "$STDLIB" ]; then
            STDLIB="$TMP_DIR/lib/kotlin-stdlib-1.9.22.jar"
            curl --fail --silent --show-error --location --retry 3 \
              -o "$STDLIB" \
              "https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-stdlib/1.9.22/kotlin-stdlib-1.9.22.jar"
          fi
          test -s "$STDLIB"
          if [ "$STDLIB" != "$TMP_DIR/lib/kotlin-stdlib.jar" ]; then
            cp "$STDLIB" "$TMP_DIR/lib/kotlin-stdlib.jar"
          fi
          cat > "$TMP_DIR/Consumer.java" <<'JAVA'
          import org.sovereign.safePathResolver.android.SafePathResolverAndroidKt;

          public final class Consumer {
              public static void main(String[] args) {
                  String resolved = SafePathResolverAndroidKt.resolveContained("/consumer/root", "nested/./file.txt");
                  if (!"/consumer/root/nested/file.txt".equals(resolved)) {
                      throw new AssertionError("unexpected packaged result: " + resolved);
                  }
                  System.out.println("OUT_OF_TREE_AAR_OK " + resolved);
              }
          }
          JAVA
          if command -v cygpath >/dev/null 2>&1; then
            CP="$(cygpath -wp "$TMP_DIR/lib/classes.jar:$TMP_DIR/lib/kotlin-stdlib.jar")"
            RUNTIME_CP="$(cygpath -wp "$TMP_DIR:$TMP_DIR/lib/classes.jar:$TMP_DIR/lib/kotlin-stdlib.jar")"
          else
            SEP=$(java -XshowSettings:properties -version 2>&1 | tr -d '\r' | awk -F'= ' '/path.separator =/{print $2; exit}')
            test -n "$SEP"
            CP="$TMP_DIR/lib/classes.jar${SEP}$TMP_DIR/lib/kotlin-stdlib.jar"
            RUNTIME_CP="$TMP_DIR${SEP}$CP"
          fi
          javac -cp "$CP" "$TMP_DIR/Consumer.java"
          java -cp "$RUNTIME_CP" Consumer

      - name: Verify reproducible AAR
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf safe-path-resolver/build
          ./gradlew assembleRelease --no-daemon --console=plain
          AAR=$(find safe-path-resolver/build -name "*.aar" | head -1)
          test -n "$AAR"
          mkdir -p /tmp/aar1
          cp "$AAR" /tmp/aar1/
          rm -rf safe-path-resolver/build
          ./gradlew assembleRelease --no-daemon --console=plain
          AAR2=$(find safe-path-resolver/build -name '*.aar' | head -1)
          test -n "$AAR2"
          mkdir -p /tmp/aar2
          cp "$AAR2" /tmp/aar2/
          diff <(sha256sum /tmp/aar1/*.aar | awk '{print $1}') \
               <(sha256sum /tmp/aar2/*.aar | awk '{print $1}') \
            && echo "REPRODUCIBLE OK"

      # --- Instrumentation matrix ----------------------------------------------------
      # Windows + macOS both run on physical x86_64 with hardware-accelerated
      # emulation (Windows: Hyper-V; macOS: HVF). Linux runners do NOT expose
      # /dev/kvm, so KVM is unavailable and we skip the emulator step there.
      # The unit tests + JVM-hosted conformance + AAR out-of-tree verification
      # already validate the package on all three OSes.
      - name: Run instrumentation tests on Android emulator (Windows - Hyper-V x86_64)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -Eeuo pipefail
          AVD_HOME="$RUNNER_TEMP/android-avd"
          rm -rf "$AVD_HOME"
          mkdir -p "$AVD_HOME"
          export ANDROID_AVD_HOME="$AVD_HOME"

          "C:\Android\android-sdk\cmdline-tools\16.0\bin\avdmanager.bat" create avd \
            --name sovereign-android-api34 \
            --package "system-images;android-34;google_apis;x86_64" \
            --device "pixel_2" \
            --force

          echo "Starting emulator with verbose logging..."
          nohup "C:\Android\android-sdk\emulator\emulator.exe" \
            -avd sovereign-android-api34 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot-load \
            -no-snapshot-save \
            -wipe-data \
            -gpu swiftshader_indirect \
            -verbose \
            >/tmp/sovereign-emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "Emulator PID: $EMULATOR_PID"

          echo "Waiting for adb device (timeout 600s)..."
          if ! timeout 600 "C:\Android\android-sdk\platform-tools\adb.exe" wait-for-device; then
            echo "===== EMULATOR LOG (due to timeout waiting for device) ====="
            tail -n 500 /tmp/sovereign-emulator.log || true
            exit 1
          fi
          echo "Device connected"

          echo "Waiting for boot completion..."
          for i in $(seq 1 300); do
            boot=$("C:\Android\android-sdk\platform-tools\adb.exe" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$boot" = "1" ]; then
              echo "Boot completed at attempt $i"
              break
            fi
            if [ $((i % 30)) -eq 0 ]; then
              echo "  ... still waiting (attempt $i/300)"
              "C:\Android\android-sdk\platform-tools\adb.exe" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | xargs -I{} echo "  boot_completed={}"
            fi
            sleep 2
          done
          "C:\Android\android-sdk\platform-tools\adb.exe" shell getprop sys.boot_completed | tr -d '\r' | grep -q '^1$'
          if [ $? -ne 0 ]; then
            echo "===== EMULATOR LOG (due to timeout waiting for boot) ====="
            tail -n 500 /tmp/sovereign-emulator.log || true
            exit 1
          fi
          echo "Boot verified"

          "C:\Android\android-sdk\platform-tools\adb.exe" shell settings put global window_animation_scale 0
          "C:\Android\android-sdk\platform-tools\adb.exe" shell settings put global transition_animation_scale 0
          "C:\Android\android-sdk\platform-tools\adb.exe" shell settings put global animator_duration_scale 0

          echo "Installing test APK..."
          ./gradlew :safe-path-resolver:installDebugAndroidTest --no-daemon --console=plain

          INSTRUMENTATION=$("C:\\Android\\android-sdk\\platform-tools\\adb.exe" shell pm list instrumentation \
            | tr -d '\r' \
            | sed -n 's/^instrumentation:\([^ ]*\).*/\1/p' \
            | grep '/androidx.test.runner.AndroidJUnitRunner' \
            | head -1)
          test -n "$INSTRUMENTATION"
          echo "Instrumentation target: $INSTRUMENTATION"
          "C:\Android\android-sdk\platform-tools\adb.exe" shell pm list instrumentation

          TEST_CLASS="org.sovereign.safePathResolver.android.SafePathResolverAndroidDeviceTest"

          run_instrumentation() {
            local method="$1"
            echo "===== START $method ====="
            set +e
            timeout --preserve-status 10m "C:\Android\android-sdk\platform-tools\adb.exe" shell am instrument -w -r \
              -e class "$TEST_CLASS#$method" \
              "$INSTRUMENTATION"
            local status=$?
            set -e
            echo "===== END $method status=$status ====="
            if [ "$status" -ne 0 ]; then
              echo "===== ADB DEVICES ====="
              "C:\Android\android-sdk\platform-tools\adb.exe" devices -l || true
              echo "===== PACKAGE/INSTRUMENTATION ====="
              "C:\Android\android-sdk\platform-tools\adb.exe" shell pm list packages || true
              "C:\Android\android-sdk\platform-tools\adb.exe" shell pm list instrumentation || true
              echo "===== EMULATOR LOG ====="
              tail -n 500 /tmp/sovereign-emulator.log || true
              echo "===== LOGCAT ====="
              "C:\Android\android-sdk\platform-tools\adb.exe" logcat -d -t 500 || true
              return "$status"
            fi
          }

          run_instrumentation normalize_and_contain_on_art
          run_instrumentation traversal_escape_is_blocked_on_art
          run_instrumentation serializer_is_deterministic_on_art

          echo "ANDROID_EMULATOR_INSTRUMENTATION_OK"

          echo "===== FINAL EMULATOR LOG (last 200 lines) ====="
          tail -n 200 /tmp/sovereign-emulator.log || true

      - name: Run instrumentation tests on Android emulator (macOS - HVF x86_64)
        if: matrix.os == 'macos-15-intel'
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          AVD_HOME="$RUNNER_TEMP/android-avd"
          rm -rf "$AVD_HOME"
          mkdir -p "$AVD_HOME"
          export ANDROID_AVD_HOME="$AVD_HOME"

          # macOS runners don't ship GNU `timeout` by default. If neither
          # `timeout` nor `gtimeout` is on PATH, define a portable fallback
          # that runs a command and force-kills it after N seconds.
          if ! command -v timeout >/dev/null 2>&1 && ! command -v gtimeout >/dev/null 2>&1; then
            timeout() {
              local secs=$1; shift
              "$@" &
              local cmd_pid=$!
              ( sleep "$secs" && kill -9 "$cmd_pid" 2>/dev/null ) &
              local watchdog_pid=$!
              wait "$cmd_pid"; local rc=$?
              kill -9 "$watchdog_pid" 2>/dev/null || true
              return $rc
            }
            export -f timeout
          fi

          # avdmanager lives under cmdline-tools/<ver>/bin on macOS preinstall.
          AVDMGR=$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name avdmanager 2>/dev/null | head -1)
          SDKMANAGER=$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | head -1)
          test -x "$AVDMGR"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "emulator" "system-images;android-34;google_apis;x86_64"

          "$AVDMGR" create avd \
            --name sovereign-android-api34 \
            --package "system-images;android-34;google_apis;x86_64" \
            --device "pixel_2" \
            --force

          echo "Starting emulator with verbose logging..."
          nohup "$SDK/emulator/emulator" \
            -avd sovereign-android-api34 \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot-load \
            -no-snapshot-save \
            -wipe-data \
            -gpu swiftshader_indirect \
            -verbose \
            >/tmp/sovereign-emulator.log 2>&1 &
          EMULATOR_PID=$!
          echo "Emulator PID: $EMULATOR_PID"

          echo "Waiting for adb device (timeout 600s)..."
          if ! timeout 600 "$SDK/platform-tools/adb" wait-for-device; then
            echo "===== EMULATOR LOG (due to timeout waiting for device) ====="
            tail -n 500 /tmp/sovereign-emulator.log || true
            exit 1
          fi
          echo "Device connected"

          echo "Waiting for boot completion..."
          for i in $(seq 1 300); do
            boot=$("$SDK/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$boot" = "1" ]; then
              echo "Boot completed at attempt $i"
              break
            fi
            if [ $((i % 30)) -eq 0 ]; then
              echo "  ... still waiting (attempt $i/300)"
            fi
            sleep 2
          done
          "$SDK/platform-tools/adb" shell getprop sys.boot_completed | tr -d '\r' | grep -q '^1$'
          if [ $? -ne 0 ]; then
            echo "===== EMULATOR LOG (due to timeout waiting for boot) ====="
            tail -n 500 /tmp/sovereign-emulator.log || true
            exit 1
          fi
          echo "Boot verified"

          "$SDK/platform-tools/adb" shell settings put global window_animation_scale 0
          "$SDK/platform-tools/adb" shell settings put global transition_animation_scale 0
          "$SDK/platform-tools/adb" shell settings put global animator_duration_scale 0

          echo "Installing test APK..."
          ./gradlew :safe-path-resolver:installDebugAndroidTest --no-daemon --console=plain

          INSTRUMENTATION=$("$SDK/platform-tools/adb" shell pm list instrumentation \
            | tr -d '\r' \
            | sed -n 's/^instrumentation:\([^ ]*\).*/\1/p' \
            | grep '/androidx.test.runner.AndroidJUnitRunner' \
            | head -1)
          test -n "$INSTRUMENTATION"
          echo "Instrumentation target: $INSTRUMENTATION"

          TEST_CLASS="org.sovereign.safePathResolver.android.SafePathResolverAndroidDeviceTest"

          run_instrumentation() {
            local method="$1"
            echo "===== START $method ====="
            set +e
            timeout 600 "$SDK/platform-tools/adb" shell am instrument -w -r \
              -e class "$TEST_CLASS#$method" \
              "$INSTRUMENTATION"
            local status=$?
            set -e
            echo "===== END $method status=$status ====="
            if [ "$status" -ne 0 ]; then
              "$SDK/platform-tools/adb" devices -l || true
              tail -n 500 /tmp/sovereign-emulator.log || true
              "$SDK/platform-tools/adb" logcat -d -t 500 || true
              return "$status"
            fi
          }

          run_instrumentation normalize_and_contain_on_art
          run_instrumentation traversal_escape_is_blocked_on_art
          run_instrumentation serializer_is_deterministic_on_art

          echo "ANDROID_EMULATOR_INSTRUMENTATION_OK"
          tail -n 200 /tmp/sovereign-emulator.log || true

      - name: Upload AAR artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: android-aars
          path: |
            ecosystems/android/safe-path-resolver/build/outputs/aar/*.aar
          if-no-files-found: error
