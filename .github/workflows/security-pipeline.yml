name: Security Pipeline (CI/CD)

# Security pipeline for Python code: Bandit (SAST), Safety (dependency audit), GitHub MCP
# Tools configured: bandit, safety, github-mcp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install security tools
        run: |
          pip install bandit safety
      - name: Bandit SAST scan
        run: bandit -r . -f json -o bandit-report.json
      - name: Safety dependency audit
        run: safety check --json --output safety-report.json
      - name: GitHub MCP security integration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "GitHub MCP configured for security reporting"

      - name: Upload security findings to GitHub Security tab (SARIF)
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: bandit-report.json,safety-report.json
          category: security-pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
