name: Security Pipeline (CI/CD)

# Security pipeline for Python code: Bandit (SAST), Safety (dependency audit), GitHub MCP
# Tools configured: bandit, safety, github-mcp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install security tools
        run: |
          pip install bandit safety bandit-sarif
      - name: Bandit SAST scan
        continue-on-error: true
        run: |
          mkdir -p sarif-reports
          bandit -r . -f json -o bandit-report.json || true
          if [ -f bandit-report.json ]; then
            python -c "
import json, sys
with open('bandit-report.json') as f:
    data = json.load(f)
sarif = {
    'version': '2.1.0',
    'runs': [{
        'tool': {
            'driver': {
                'name': 'bandit',
                'version': '1.9.4',
                'informationUri': 'https://github.com/PyCQA/bandit',
                'rules': []
            }
        },
        'results': [
            {
                'ruleId': r.get('test_id', 'B000'),
                'level': 'error' if r.get('issue_severity') == 'HIGH' else 'warning',
                'message': {'text': r.get('issue_text', '')},
                'locations': [{
                    'physicalLocation': {
                        'artifactUri': f"file:///{r.get('filename', 'unknown')}",
                        'region': {'startLine': r.get('line_number', 1)}
                    }
                }]
            } for r in data.get('results', [])
        ]
    }]
}
with open('sarif-reports/bandit.sarif', 'w') as f:
    json.dump(sarif, f)
print('Bandit SARIF generated')
"
          fi
      - name: Safety dependency audit
        continue-on-error: true
        run: |
          safety check --json --output safety-report.json || true
      - name: GitHub MCP security integration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "GitHub MCP configured for security reporting"

      - name: Upload security findings to GitHub Security tab (SARIF)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: sarif-reports/bandit.sarif
          category: security-pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
