name: one-time-browser-syntax-repair

on:
  push:
    branches: [feat/continuity-hardening]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard
        run: test -f .automation/browser-syntax-repair
      - name: Repair missing function brace
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cubes/browser/src/index.js')
          text = p.read_text(encoding='utf-8')
          if not text.rstrip().endswith('}'):
              raise SystemExit('browser source does not end with a brace')
          if text.count('export async function launch') != 1:
              raise SystemExit('unexpected launch declaration count')
          text = text.rstrip() + '\n}\n'
          p.write_text(text, encoding='utf-8')
          PY
          node --check cubes/browser/src/index.js
      - name: Commit and clean
        run: |
          rm -f .automation/browser-syntax-repair
          rm -f .github/workflows/one-time-browser-syntax-repair.yml
          rmdir .automation 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close browser launch function"
          git push origin feat/continuity-hardening
