name: python-ports

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - 'contracts/conformance/**'
  pull_request:
    branches: [main]
    paths:
      - 'python/**'
      - 'contracts/conformance/**'

jobs:
  python-ports:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax check
        run: |
          python -m py_compile python/sovereign_safe_path_resolver/src/sovereign_safe_path_resolver/__init__.py
          python -m py_compile python/sovereign_runtime_capability_inspector/src/sovereign_runtime_capability_inspector/__init__.py
          python -m py_compile python/sovereign_canonical_json/src/sovereign_canonical_json/__init__.py
          python -m py_compile python/scripts/run_conformance.py
      - name: Native tests
        run: |
          python -m pip install --quiet pytest
          python -m pytest python/sovereign_safe_path_resolver/tests python/sovereign_runtime_capability_inspector/tests python/sovereign_canonical_json/tests -q
      - name: Language-neutral conformance (SPR1 + RCI1 + CJSON1)
        run: |
          python python/scripts/run_conformance.py contracts/conformance/vectors.safe-path-resolver.json python/sovereign_safe_path_resolver/src/sovereign_safe_path_resolver/__init__.py
          python python/scripts/run_conformance.py contracts/conformance/vectors.runtime-capability-inspector.json python/sovereign_runtime_capability_inspector/src/sovereign_runtime_capability_inspector/__init__.py
          python python/scripts/run_conformance.py contracts/conformance/vectors.canonical-json.json python/sovereign_canonical_json/src/sovereign_canonical_json/__init__.py
