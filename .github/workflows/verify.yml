name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run check
      - name: Bounded contract and integration tests
        run: node scripts/run-tests-bounded.mjs
        env:
          SOVEREIGN_TEST_FILE_TIMEOUT_MS: 30000
      - name: Real browser smoke test
        run: npm run test:browser
      - name: Validate declaration config
        run: node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync('jsconfig.declarations.json','utf8')); if(c.compilerOptions.allowJs!==true||c.compilerOptions.declaration!==true||c.compilerOptions.emitDeclarationOnly!==true) process.exit(1); if(!Array.isArray(c.include)||c.include.length!==2) process.exit(1);"
      - name: Validate pinned TypeScript tool
        run: npx --yes typescript@7.0.2 --version
      - name: Emit declaration pilot
        run: npx --yes typescript@7.0.2 --project jsconfig.declarations.json
      - name: Verify emitted declaration pilot
        run: node -e "const fs=require('fs'); for (const f of ['.artifacts/declarations/cubes/safe-path-resolver-containment-boundary/src/index.d.ts','.artifacts/declarations/cubes/runtime-capability-inspector/src/index.d.ts']) { if(!fs.existsSync(f)) throw new Error('missing declaration: '+f); const s=fs.readFileSync(f,'utf8'); if(!s.includes('export')) throw new Error('declaration has no public exports: '+f); }"
