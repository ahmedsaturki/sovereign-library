name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        node: [24]
    steps:
      - uses: actions/checkout@v4
      - name: Link browser cubes for in-repo Product resolution
        run: node scripts/link-browser-cubes.mjs
        shell: bash
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run check
      - name: Bounded contract and integration tests
        run: node scripts/run-tests-bounded.mjs
        env:
          SOVEREIGN_TEST_FILE_TIMEOUT_MS: 30000
      - name: Declaration pilot
        run: node scripts/verify-declarations.mjs
      - name: Package tooling verification
        run: node scripts/verify-package-tooling.mjs
      - name: Reproducible package verification
        run: node scripts/verify-reproducible-package.mjs
      - name: Security boundary verification
        run: node scripts/verify-security-boundaries.mjs
      - name: Publication guard
        run: node scripts/verify-publication-guard.mjs
      - name: Language-neutral conformance (canonical Node candidates)
        run: |
          node scripts/run-conformance.mjs --self contracts/conformance/vectors.safe-path-resolver.json
          node scripts/run-conformance.mjs --self contracts/conformance/vectors.runtime-capability-inspector.json
      - name: Select Windows Chrome for deterministic CDP smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe"
          )
          $browser = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browser) { throw 'Google Chrome executable not found on Windows runner' }
          Write-Host "Using Chrome: $browser"
          "BROWSER_EXECUTABLE=$browser" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare Linux Chromium CDP compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -Eeuo pipefail
          REAL_BROWSER="$(node -e "import('./cubes/browser/src/index.js').then(({BrowserSession}) => process.stdout.write(BrowserSession.findExecutable() || ''))")"
          test -n "$REAL_BROWSER"
          test -x "$REAL_BROWSER"
          echo "Using native Chromium executable: $REAL_BROWSER"
          echo "BROWSER_EXECUTABLE=$REAL_BROWSER" >> "$GITHUB_ENV"
          echo "SOVEREIGN_BROWSER_NO_SANDBOX=1" >> "$GITHUB_ENV"
          "$REAL_BROWSER" --version
      - name: Real browser smoke test
        run: npm run test:browser
