name: one-time-windows-browser-diagnostic

on:
  push:
    branches: [feat/continuity-hardening]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe Chromium-family executables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $candidates = @(
            "$env:PROGRAMFILES\Google\Chrome\Application\chrome.exe",
            "$env:PROGRAMFILES(X86)\Google\Chrome\Application\chrome.exe",
            "$env:LOCALAPPDATA\Google\Chrome\Application\chrome.exe",
            "$env:PROGRAMFILES\Microsoft\Edge\Application\msedge.exe",
            "$env:PROGRAMFILES(X86)\Microsoft\Edge\Application\msedge.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -Unique
          if (-not $found) { throw 'No Chrome-family executable found' }
          foreach ($exe in $found) {
            Write-Host "=== EXECUTABLE: $exe ==="
            & $exe --version
            $port = Get-Random -Minimum 49152 -Maximum 65535
            $profile = Join-Path $env:TEMP ("sovereign-diag-{0}" -f ([guid]::NewGuid().ToString('N')))
            New-Item -ItemType Directory -Path $profile | Out-Null
            $args = @("--remote-debugging-port=$port", "--remote-debugging-address=127.0.0.1", "--user-data-dir=$profile", '--no-first-run', '--no-default-browser-check', '--disable-background-networking', '--disable-sync', '--disable-gpu', '--disable-dev-shm-usage', '--disable-extensions', '--disable-component-update', '--headless=new', 'about:blank')
            $p = Start-Process -FilePath $exe -ArgumentList $args -PassThru -WindowStyle Hidden
            try {
              $deadline = (Get-Date).AddSeconds(25)
              $ok = $false
              while ((Get-Date) -lt $deadline) {
                if ($p.HasExited) { Write-Host "EXITED code=$($p.ExitCode)"; break }
                try {
                  $r = Invoke-RestMethod -Uri "http://127.0.0.1:$port/json/version" -TimeoutSec 2
                  Write-Host ("CDP_OK browser={0} websocket={1}" -f $r.Browser, $r.webSocketDebuggerUrl)
                  $ok = $true
                  break
                } catch {}
                Start-Sleep -Milliseconds 250
              }
              if (-not $ok) { Write-Host "CDP_FAIL endpoint_not_exposed" }
            } finally {
              if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
              Remove-Item -LiteralPath $profile -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
