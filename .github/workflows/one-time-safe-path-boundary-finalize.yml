name: one-time-safe-path-boundary-finalize

on:
  push:
    branches: [feat/continuity-hardening]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard
        run: |
          test -f .automation/safe-path-boundary-qualification

      - name: Apply safe-path package boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          ROOT = Path('.')
          SAFE_IMPORT = "import { resolveContained } from '../../safe-path-resolver-containment-boundary/src/index.js';"
          ALIAS_IMPORT = "import { resolveContained } from '#safe-path-resolver';"
          items = [
            ('bounded-file-content-reader-safe-content-access', '@sovereign/bounded-file-content-reader-safe-content-access', 'cubes/bounded-file-content-reader-safe-content-access/src/index.js', 'packages/bounded-file-content-reader-safe-content-access'),
            ('directory-walker-bounded-tree-traversal', '@sovereign/directory-walker-bounded-tree-traversal', 'cubes/directory-walker-bounded-tree-traversal/src/index.js', 'packages/directory-walker-bounded-tree-traversal'),
            ('filesystem-metadata-stat-normalizer', '@sovereign/filesystem-metadata-stat-normalizer', 'cubes/filesystem-metadata-stat-normalizer/src/index.js', 'packages/filesystem-metadata-stat-normalizer'),
            ('safe-file-quarantine-delete', '@sovereign/safe-file-quarantine-delete', 'cubes/safe-file-quarantine-delete/src/index.js', 'packages/safe-file-quarantine-delete'),
          ]

          for cube_id, package_name, source, package_dir in items:
              source_path = ROOT / source
              text = source_path.read_text(encoding='utf-8')
              if SAFE_IMPORT not in text and ALIAS_IMPORT not in text:
                  raise SystemExit(f'missing safe-path import anchor: {source}')
              source_path.write_text(text.replace(SAFE_IMPORT, ALIAS_IMPORT, 1), encoding='utf-8')

          catalog_path = ROOT / 'scripts/package-catalog.json'
          catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          for cube_id, package_name, source, package_dir in items:
              catalog[cube_id] = {
                  'name': package_name,
                  'version': '0.1.0',
                  'description': f'Sovereign {cube_id} Cube (standalone).',
                  'packageDir': package_dir,
                  'source': source,
                  'expected': catalog.get(cube_id, {}).get('expected', []),
                  'dependencies': {'@sovereign/safe-path-resolver': '0.1.0'},
                  'imports': {'#safe-path-resolver': '@sovereign/safe-path-resolver'},
                  'status': 'TECHNICALLY_READY',
                  'reason': 'standalone-capable with explicit @sovereign/safe-path-resolver dependency boundary'
              }
          catalog_path.write_text(json.dumps(catalog, indent=2) + '\n', encoding='utf-8')

          stage_path = ROOT / 'scripts/package-stage.mjs'
          stage = stage_path.read_text(encoding='utf-8')
          if 'function stageRuntimeDependencies' not in stage:
              anchor = 'function main() {\n'
              helper = '''function stageRuntimeDependencies(spec, catalog, packageDir) {
  const dependencies = spec.dependencies || {};
  const entries = Object.entries(dependencies);
  if (entries.length === 0) return;
  const nodeModules = resolve(packageDir, 'node_modules');
  rmSync(nodeModules, { recursive: true, force: true });
  for (const [dependencyName, dependencyVersion] of entries) {
    const dependencySpec = Object.values(catalog).find((candidate) => candidate.name === dependencyName && candidate.version === dependencyVersion);
    if (!dependencySpec) fail(`runtime dependency not found in catalog: ${dependencyName}@${dependencyVersion}`);
    const dependencySource = resolve(ROOT, dependencySpec.source);
    if (!existsSync(dependencySource)) fail(`runtime dependency source is missing: ${dependencySource}`);
    const nameParts = dependencyName.split('/');
    const dependencyRoot = nameParts[0].startsWith('@')
      ? resolve(nodeModules, nameParts[0], nameParts[1])
      : resolve(nodeModules, dependencyName);
    const dependencySrc = resolve(dependencyRoot, 'src');
    mkdirSync(dependencySrc, { recursive: true });
    const dependencySourceRoot = dirname(dependencySource);
    for (const entry of readdirSync(dependencySourceRoot)) {
      const full = resolve(dependencySourceRoot, entry);
      if (statSync(full).isDirectory()) cpSync(full, resolve(dependencySrc, entry), { recursive: true });
      else if (entry.endsWith('.js') || entry.endsWith('.mjs') || entry.endsWith('.d.ts')) copyFileSync(full, resolve(dependencySrc, entry));
    }
    writeFileSync(resolve(dependencyRoot, 'package.json'), `${JSON.stringify({ name: dependencyName, version: dependencyVersion, type: 'module', exports: { '.': './src/index.js' } }, null, 2)}\n`, 'utf8');
  }
}

'''
              if anchor not in stage:
                  raise SystemExit('package-stage main anchor missing')
              stage = stage.replace(anchor, helper + anchor, 1)
          call = "  stageRuntimeDependencies(spec, catalog, packageDir);\n"
          marker = "  const expected = new Set(spec.expected || []);\n"
          if call not in stage:
              if marker not in stage:
                  raise SystemExit('package-stage expected-export anchor missing')
              stage = stage.replace(marker, marker + call, 1)
          cleanup = "  rmSync(resolve(packageDir, 'node_modules'), { recursive: true, force: true });\n"
          if cleanup not in stage:
              stage = stage.replace("} finally {\n  rmSync(TOOLS_DIR, { recursive: true, force: true });", "} finally {\n  const candidate = process.argv[2];\n  if (candidate) {\n    try {\n      const cleanupCatalog = JSON.parse(readFileSync(CATALOG_PATH, 'utf8'));\n      const cleanupPackageDir = cleanupCatalog[candidate]?.packageDir;\n      if (cleanupPackageDir) rmSync(resolve(cleanupPackageDir, 'node_modules'), { recursive: true, force: true });\n    } catch {}\n  }\n  rmSync(TOOLS_DIR, { recursive: true, force: true });", 1)
          stage_path.write_text(stage, encoding='utf-8')

          verify_path = ROOT / 'scripts/verify-package-tooling.mjs'
          verify = verify_path.read_text(encoding='utf-8')
          old_candidates = '''const CANDIDATES = [
  {
    id: 'safe-path-resolver',
    packageDir: resolve('packages/safe-path-resolver'),
    script: resolve('scripts/package-stage.mjs'),
  },
  {
    id: 'runtime-capability-inspector',
    packageDir: resolve('packages/runtime-capability-inspector'),
    script: resolve('scripts/package-stage.mjs'),
  },
];'''
          new_candidates = '''const CANDIDATES = [
  {
    id: 'safe-path-resolver',
    packageDir: resolve('packages/safe-path-resolver'),
    script: resolve('scripts/package-stage.mjs'),
  },
  {
    id: 'runtime-capability-inspector',
    packageDir: resolve('packages/runtime-capability-inspector'),
    script: resolve('scripts/package-stage.mjs'),
  },
  {
    id: 'bounded-file-content-reader-safe-content-access',
    packageDir: resolve('packages/bounded-file-content-reader-safe-content-access'),
    script: resolve('scripts/package-stage.mjs'),
    dependencies: {'@sovereign/safe-path-resolver': '0.1.0'},
    imports: {'#safe-path-resolver': '@sovereign/safe-path-resolver'},
  },
  {
    id: 'directory-walker-bounded-tree-traversal',
    packageDir: resolve('packages/directory-walker-bounded-tree-traversal'),
    script: resolve('scripts/package-stage.mjs'),
    dependencies: {'@sovereign/safe-path-resolver': '0.1.0'},
    imports: {'#safe-path-resolver': '@sovereign/safe-path-resolver'},
  },
  {
    id: 'filesystem-metadata-stat-normalizer',
    packageDir: resolve('packages/filesystem-metadata-stat-normalizer'),
    script: resolve('scripts/package-stage.mjs'),
    dependencies: {'@sovereign/safe-path-resolver': '0.1.0'},
    imports: {'#safe-path-resolver': '@sovereign/safe-path-resolver'},
  },
  {
    id: 'safe-file-quarantine-delete',
    packageDir: resolve('packages/safe-file-quarantine-delete'),
    script: resolve('scripts/package-stage.mjs'),
    dependencies: {'@sovereign/safe-path-resolver': '0.1.0'},
    imports: {'#safe-path-resolver': '@sovereign/safe-path-resolver'},
  },
];'''
          if old_candidates not in verify:
              raise SystemExit('verify-package-tooling candidate anchor missing')
          verify = verify.replace(old_candidates, new_candidates, 1)
          old_dep = "  if (pkg.dependencies || pkg.peerDependencies || pkg.optionalDependencies) fail(`${candidate.id} must have no runtime dependency declarations`);"
          new_dep = "  const expectedDependencies = candidate.dependencies ?? {};\n  if (JSON.stringify(pkg.dependencies ?? {}) !== JSON.stringify(expectedDependencies)) fail(`${candidate.id} runtime dependency boundary mismatch`);\n  if (candidate.imports && JSON.stringify(pkg.imports ?? {}) !== JSON.stringify(candidate.imports)) fail(`${candidate.id} imports boundary mismatch`);\n  if (pkg.devDependencies || pkg.peerDependencies || pkg.optionalDependencies) fail(`${candidate.id} must not have undeclared development or peer dependency classes`);"
          if old_dep not in verify:
              raise SystemExit('verify-package-tooling dependency rule anchor missing')
          verify = verify.replace(old_dep, new_dep, 1)
          runtime_marker = "    const tarball = resolve(packDir, packResult[0].filename);\n"
          runtime_probe = "    run(process.execPath, ['--input-type=module', '-e', \"await import('./src/index.js')\"], candidate.packageDir);\n"
          if runtime_probe not in verify:
              verify = verify.replace(runtime_marker, runtime_probe + runtime_marker, 1)
          verify_path.write_text(verify, encoding='utf-8')

          repro_path = ROOT / 'scripts/verify-reproducible-package.mjs'
          repro = repro_path.read_text(encoding='utf-8')
          old_repro = '''const CANDIDATES = [
  { id: 'safe-path-resolver', packageDir: resolve('packages/safe-path-resolver') },
  { id: 'runtime-capability-inspector', packageDir: resolve('packages/runtime-capability-inspector') },
];'''
          new_repro = '''const CANDIDATES = [
  { id: 'safe-path-resolver', packageDir: resolve('packages/safe-path-resolver') },
  { id: 'runtime-capability-inspector', packageDir: resolve('packages/runtime-capability-inspector') },
  { id: 'bounded-file-content-reader-safe-content-access', packageDir: resolve('packages/bounded-file-content-reader-safe-content-access') },
  { id: 'directory-walker-bounded-tree-traversal', packageDir: resolve('packages/directory-walker-bounded-tree-traversal') },
  { id: 'filesystem-metadata-stat-normalizer', packageDir: resolve('packages/filesystem-metadata-stat-normalizer') },
  { id: 'safe-file-quarantine-delete', packageDir: resolve('packages/safe-file-quarantine-delete') },
];'''
          if old_repro not in repro:
              raise SystemExit('repro candidate anchor missing')
          repro = repro.replace(old_repro, new_repro, 1)
          cleanup_marker = "    rmSync(resolve(candidate.packageDir, 'NOTICE'), { force: true });"
          cleanup_repl = "    rmSync(resolve(candidate.packageDir, 'NOTICE'), { force: true });\n    rmSync(resolve(candidate.packageDir, 'node_modules'), { recursive: true, force: true });"
          if cleanup_repl not in repro:
              repro = repro.replace(cleanup_marker, cleanup_repl, 1)
          repro_path.write_text(repro, encoding='utf-8')

          security_path = ROOT / 'scripts/verify-security-boundaries.mjs'
          security = security_path.read_text(encoding='utf-8')
          old_security = '''for (const packageName of ['safe-path-resolver', 'runtime-capability-inspector']) {
  const packageJsonPath = resolve(ROOT, 'packages', packageName, 'package.json');
  const pkg = JSON.parse(readFileSync(packageJsonPath, 'utf8'));
  for (const field of ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']) {
    if (pkg[field] && Object.keys(pkg[field]).length > 0) {
      violations.push({ file: relative(ROOT, packageJsonPath), line: 1, rule: 'package-dependency-free', message: `${field} must be absent for a dependency-free public cube`, source: JSON.stringify(pkg[field]) });
    }
  }
  if (pkg.scripts && Object.keys(pkg.scripts).length > 0) {
    violations.push({ file: relative(ROOT, packageJsonPath), line: 1, rule: 'package-no-scripts', message: 'public package must not ship development scripts', source: JSON.stringify(pkg.scripts) });
  }
}'''
          new_security = '''const packageBoundarySpecs = {
  'safe-path-resolver': {dependencies: {}},
  'runtime-capability-inspector': {dependencies: {}},
  'bounded-file-content-reader-safe-content-access': {dependencies: {'@sovereign/safe-path-resolver': '0.1.0'}},
  'directory-walker-bounded-tree-traversal': {dependencies: {'@sovereign/safe-path-resolver': '0.1.0'}},
  'filesystem-metadata-stat-normalizer': {dependencies: {'@sovereign/safe-path-resolver': '0.1.0'}},
  'safe-file-quarantine-delete': {dependencies: {'@sovereign/safe-path-resolver': '0.1.0'}},
};
for (const [packageName, boundary] of Object.entries(packageBoundarySpecs)) {
  const packageJsonPath = resolve(ROOT, 'packages', packageName, 'package.json');
  const pkg = JSON.parse(readFileSync(packageJsonPath, 'utf8'));
  if (JSON.stringify(pkg.dependencies ?? {}) !== JSON.stringify(boundary.dependencies)) {
    violations.push({ file: relative(ROOT, packageJsonPath), line: 1, rule: 'package-dependency-boundary', message: 'runtime dependency declaration does not match approved boundary', source: JSON.stringify(pkg.dependencies ?? {}) });
  }
  for (const field of ['devDependencies', 'peerDependencies', 'optionalDependencies']) {
    if (pkg[field] && Object.keys(pkg[field]).length > 0) {
      violations.push({ file: relative(ROOT, packageJsonPath), line: 1, rule: 'package-extra-dependencies', message: `${field} must be absent`, source: JSON.stringify(pkg[field]) });
    }
  }
  if (pkg.scripts && Object.keys(pkg.scripts).length > 0) {
    violations.push({ file: relative(ROOT, packageJsonPath), line: 1, rule: 'package-no-scripts', message: 'public package must not ship development scripts', source: JSON.stringify(pkg.scripts) });
  }
}'''
          if old_security not in security:
              raise SystemExit('security package boundary anchor missing')
          security = security.replace(old_security, new_security, 1)
          security_path.write_text(security, encoding='utf-8')

          matrix_path = ROOT / 'docs/release/PACKAGE_QUALIFICATION_MATRIX-V0.1.md'
          matrix = matrix_path.read_text(encoding='utf-8')
          matrix = matrix.replace('# Package Qualification Matrix (v15)', '# Package Qualification Matrix (v16)', 1)
          matrix = matrix.replace('| TECHNICALLY_READY | 73 |', '| TECHNICALLY_READY | 77 |', 1)
          matrix = matrix.replace('| CONDITIONAL | 4 |', '| CONDITIONAL | 0 |', 1)
          for cube_id, package_name, source, package_dir in items:
              pattern = re.compile(r'^\| ' + re.escape(cube_id) + r' \| CONDITIONAL \|.*$', re.MULTILINE)
              replacement = f'| {cube_id} | TECHNICALLY_READY | {package_name} | explicit @sovereign/safe-path-resolver runtime dependency boundary; standalone staging and isolated runtime qualification |'
              matrix, count = pattern.subn(replacement, matrix, count=1)
              if count != 1:
                  raise SystemExit(f'matrix row not found: {cube_id}')
          matrix_path.write_text(matrix, encoding='utf-8')

          control_path = ROOT / 'PROJECT_CONTROL.md'
          control = control_path.read_text(encoding='utf-8')
          old_count = '74 package entries representing 73 unique Cube sources'
          if old_count in control:
              control = control.replace(old_count, '78 package entries representing 77 unique Cube sources', 1)
          old_conditional = '- Cubes with unresolved runtime coupling kept CONDITIONAL until the dependency boundary can be made real without breaking monorepo behavior;'
          if old_conditional in control:
              control = control.replace(old_conditional, '- The four previously Conditional safe-path-resolver consumers now use an explicit @sovereign/safe-path-resolver dependency boundary and are qualified as TECHNICALLY_READY;', 1)
          control_path.write_text(control, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check cubes/bounded-file-content-reader-safe-content-access/src/index.js
          node --check cubes/directory-walker-bounded-tree-traversal/src/index.js
          node --check cubes/filesystem-metadata-stat-normalizer/src/index.js
          node --check cubes/safe-file-quarantine-delete/src/index.js
          node --check scripts/package-stage.mjs
          node --check scripts/verify-package-tooling.mjs
          node --check scripts/verify-reproducible-package.mjs
          node --check scripts/verify-security-boundaries.mjs
          node --test --test-timeout=10000 cubes/bounded-file-content-reader-safe-content-access/test/index.test.js cubes/directory-walker-bounded-tree-traversal/test/index.test.js cubes/filesystem-metadata-stat-normalizer/test/index.test.js cubes/safe-file-quarantine-delete/test/index.test.js
          node scripts/verify-package-tooling.mjs
          node scripts/verify-reproducible-package.mjs
          node scripts/verify-security-boundaries.mjs

      - name: Remove one-time automation and commit final migration
        run: |
          rm -f .automation/safe-path-boundary-qualification
          rm -f scripts/migrate-safe-path-boundaries.mjs
          rm -f .github/workflows/one-time-safe-path-boundary-finalize.yml
          rmdir .automation 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: resolve safe-path-resolver package dependency boundaries"
          git push origin feat/continuity-hardening
