name: ci-maintenance-patch

on:
  push:
    branches: ["feat/continuity-hardening"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/continuity-hardening
          fetch-depth: 0
      - name: Apply portability fixes
        shell: python
        run: python scripts/ci-maintenance-patch.py
      - name: Verify patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git status --short
      - name: Commit and push patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release-engineering.yml .github/workflows/android.yml scripts/ci-maintenance-patch.py .github/workflows/ci-maintenance-patch.yml
          git commit -m "fix(ci): harden chaos artifact and Android runner portability"
          git rm scripts/ci-maintenance-patch.py .github/workflows/ci-maintenance-patch.yml
          git commit --amend --no-edit
          git push origin HEAD:feat/continuity-hardening
