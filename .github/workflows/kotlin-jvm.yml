name: kotlin-jvm

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "ecosystems/kotlin/**"
      - ".github/workflows/kotlin-jvm.yml"
      - "contracts/conformance/**"
      - ".github/workflows/security-pipeline.yml"
  pull_request:
    branches: [main, "feat/**"]
    paths:
      - "ecosystems/kotlin/**"
      - ".github/workflows/kotlin-jvm.yml"
      - "contracts/conformance/**"

permissions:
  contents: read

jobs:
  kotlin-jvm:
    name: Kotlin/JVM ${{ matrix.os }} / JDK 17
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    defaults:
      run:
        working-directory: ecosystems/kotlin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@da187c8e6ffbd3802e00f2477aa5a822b25f2dda # v4.4.4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Validate wrapper
        run: gradle wrapper --version

      - name: Run tests + language-neutral conformance
        run: gradle test --no-daemon --console=plain

      - name: Build JVM artifacts
        run: gradle jar --no-daemon --console=plain

      - name: Verify reproducible archives
        shell: bash
        env:
          SOURCE_DATE_EPOCH: "1735689600"
        run: |
          set -euo pipefail
          rm -rf safe-path-resolver/build runtime-capability-inspector/build conformance/build
          gradle jar --no-daemon --console=plain
          mkdir -p /tmp/oot1 && rm -f /tmp/oot1/* \
            && cp safe-path-resolver/build/libs/safe-path-resolver-0.1.0.jar /tmp/oot1/ \
            && cp runtime-capability-inspector/build/libs/runtime-capability-inspector-0.1.0.jar /tmp/oot1/
          rm -rf safe-path-resolver/build runtime-capability-inspector/build conformance/build
          gradle jar --no-daemon --console=plain
          mkdir -p /tmp/oot2 && rm -f /tmp/oot2/* \
            && cp safe-path-resolver/build/libs/safe-path-resolver-0.1.0.jar /tmp/oot2/ \
            && cp runtime-capability-inspector/build/libs/runtime-capability-inspector-0.1.0.jar /tmp/oot2/
          diff <(sha256sum /tmp/oot1/*.jar | awk '{print $1}' | sort) \
               <(sha256sum /tmp/oot2/*.jar | awk '{print $1}' | sort) \
            && echo "REPRODUCIBLE OK"

      - name: Upload JVM artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: kotlin-jvm-jars
          path: |
            ecosystems/kotlin/safe-path-resolver/build/libs/*.jar
            ecosystems/kotlin/runtime-capability-inspector/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload SBOM (SPDX, ubuntu only)
        if: matrix.os == 'ubuntu-latest' && always()
        uses: anchore/sbom-action@2bf69e2d2a4a47fc6a5d4ec627ecbce6e9f9f9f9
        with:
          format: spdx-json
          artifact-name: kotlin-jvm-sbom.spdx.json
        continue-on-error: true
