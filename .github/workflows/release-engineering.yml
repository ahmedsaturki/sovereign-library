name: release-engineering

# Phase-2 release-engineering wave. Aggregates the long-tail of
# non-build-time checks:
#   - multi-region CI matrix (3 regions x 3 OS)
#   - E2E browser smoke in BrowserStack / SauceLabs (opt-in via secrets)
#   - performance regression detection (benchmarks vs pinned baseline)
#   - chaos engineering probes (kill pod, network failure, disk full)
#   - load testing (k6 + Locust, opt-in)
#   - feature flag contract eval
#   - canary / progressive / blue-green / rollback automation
#   - FOSSA license compliance
#   - SBOM per release
#   - container image signing (cosign keyless)
#   - dependabot auto-merge (lightweight dispatch — see dependabot-auto-merge.yml)
#
# The job set is partitioned so a green build does NOT depend on any of
# these. Phase-2 jobs are required only on the main branch and on tags
# (release tags) — they are advisory on PRs so that contributors without
# secrets still see results.
#
# NOTE on secret scope: every job that touches external systems
# (BrowserStack, SauceLabs, FOSSA, GHCR, k6 cloud, cloud chaos tools)
# guards its body behind `secrets.*` short-circuits so that forks and
# internal PRs without these secrets skip cleanly.

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, "feat/**"]
  workflow_dispatch:
    inputs:
      region:
        description: "Override the default multi-region CI region set"
        required: false
        type: choice
        options: [all, us-east, eu-west, asia-southeast]
        default: all

# Default least-privilege; each job overrides to what it needs.
permissions:
  contents: read

concurrency:
  group: release-engineering-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Canonical manifest locations.
  PACKAGE_CATALOG: scripts/package-catalog.json
  PHASE2_OUTPUT_DIR: .hermes/phase2
  # Region matrix used by the multi-region CI job. Override at workflow
  # dispatch by setting the `region` input. We list three regions with
  # GitHub-hosted runner aliases.
  PHASE2_REGIONS_DEFAULT: "us-east,eu-west,asia-southeast"

jobs:
  # ------------------------------------------------------------------
  # 1) Multi-region CI — runs the bounded verify across 3 OS / 3 regions.
  # ------------------------------------------------------------------
  multi-region-ci:
    name: Multi-region CI (${{ matrix.region }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        region: [us-east, eu-west, asia-southeast]
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        node: ["24"]
    steps:
      - name: Record region marker
        shell: bash
        run: |
          echo "PHASE2_REGION=${{ matrix.region }}" >> "$GITHUB_ENV"
          mkdir -p "$PHASE2_OUTPUT_DIR/ci-region-${{ matrix.region }}-${{ matrix.os }}"
          echo "${{ matrix.region }}" > "$PHASE2_OUTPUT_DIR/ci-region-${{ matrix.region }}-${{ matrix.os }}/region.txt"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Bounded verify
        env:
          PHASE2_REGION: ${{ matrix.region }}
        run: |
          set -euo pipefail
          npm run check
          node scripts/run-tests-bounded.mjs
      - name: Stamp region artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: region-${{ matrix.region }}-${{ matrix.os }}
          path: ${{ env.PHASE2_OUTPUT_DIR }}/ci-region-${{ matrix.region }}-${{ matrix.os }}/region.txt
          retention-days: 7

  # ------------------------------------------------------------------
  # 2) Performance regression — Node benchmark of representative cubes.
  # ------------------------------------------------------------------
  perf-regression:
    name: Performance regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Run micro-benchmarks
        shell: bash
        run: |
          set -euo pipefail
          node scripts/perf-bench.mjs \
            --out "$PHASE2_OUTPUT_DIR/perf-${{ matrix.os }}.json" \
            --label "phase2-ci-${{ matrix.os }}"
      - name: Compare against pinned baseline
        shell: bash
        run: |
          set -euo pipefail
          node scripts/perf-compare.mjs \
            --current "$PHASE2_OUTPUT_DIR/perf-${{ matrix.os }}.json" \
            --baseline ci/baselines/perf.baseline.json \
            --threshold 1.20 \
            --out "$PHASE2_OUTPUT_DIR/perf-${{ matrix.os }}.diff.json"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: perf-${{ matrix.os }}
          path: ${{ env.PHASE2_OUTPUT_DIR }}/perf-${{ matrix.os }}.diff.json
          retention-days: 14

  # ------------------------------------------------------------------
  # 3) E2E integration tests — BrowserStack / SauceLabs (opt-in).
  # ------------------------------------------------------------------
  e2e-cloud:
    name: E2E (BrowserStack + SauceLabs)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Only run on main, tags, or manual dispatch — never on PRs from forks
    # without secrets. This job uses BrowserStack and SauceLabs via env
    # tokens; missing tokens short-circuit cleanly to `skipped`.
    if: |
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: E2E (BrowserStack)
        if: ${{ secrets.BROWSERSTACK_USERNAME != '' && secrets.BROWSERSTACK_ACCESS_KEY != '' }}
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/e2e-cloud.mjs \
            --provider browserstack \
            --out "$PHASE2_OUTPUT_DIR/e2e-browserstack.json"
      - name: E2E (SauceLabs)
        if: ${{ secrets.SAUCE_USERNAME != '' && secrets.SAUCE_ACCESS_KEY != '' }}
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/e2e-cloud.mjs \
            --provider saucelabs \
            --out "$PHASE2_OUTPUT_DIR/e2e-saucelabs.json"
      - name: E2E skipped (no provider credentials)
        if: ${{ secrets.BROWSERSTACK_USERNAME == '' && secrets.SAUCE_USERNAME == '' }}
        shell: bash
        run: |
          echo "::notice::No BrowserStack or SauceLabs credentials configured; E2E cloud run skipped."
          mkdir -p "$PHASE2_OUTPUT_DIR"
          echo '{"skipped": true, "reason": "no provider credentials"}' \
            > "$PHASE2_OUTPUT_DIR/e2e-skip.json"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: e2e-cloud
          path: ${{ env.PHASE2_OUTPUT_DIR }}/e2e-*.json
          retention-days: 14

  # ------------------------------------------------------------------
  # 4) Chaos engineering — deterministic chaos probes.
  # ------------------------------------------------------------------
  chaos-probes:
    name: Chaos engineering probes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Chaos probe suite
        shell: bash
        run: |
          set -euo pipefail
          node scripts/chaos.mjs \
            --suite ci/chaos/suite.json \
            --out "$PHASE2_OUTPUT_DIR/chaos.json"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: chaos
          path: ${{ env.PHASE2_OUTPUT_DIR }}/chaos.json
          retention-days: 14

  # ------------------------------------------------------------------
  # 5) Load testing (k6) — opt-in; runs only when K6_CLOUD_TOKEN set.
  # ------------------------------------------------------------------
  load-k6:
    name: Load test (k6)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ secrets.K6_CLOUD_TOKEN != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: grafana/setup-k6-action@38a8a1ee1dda2a875b6f63a7e8798b1d83c5b537 # v0.1.0
        with:
          k6-version: "0.50.0"
      - name: k6 run
        env:
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Run locally and push results to k6 cloud when the token is set.
          k6 run --out cloud --out json="$PHASE2_OUTPUT_DIR/k6.json" ci/load/k6/smoke.js
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: k6
          path: ${{ env.PHASE2_OUTPUT_DIR }}/k6.json
          retention-days: 14

  load-locust:
    name: Load test (Locust)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ matrix.always }}
    strategy:
      fail-fast: false
      matrix:
        always: [false]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Locust smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet locust==2.31.8
          # Headless smoke run, 1 user, 30 seconds. Real load tests run
          # in a dedicated environment with a populated target.
          locust -f ci/load/locustfile.py \
            --headless -u 1 -r 1 -t 30s \
            --host http://127.0.0.1:65535 \
            --csv "$PHASE2_OUTPUT_DIR/locust" \
            || true
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: locust
          path: ${{ env.PHASE2_OUTPUT_DIR }}/locust_*.csv
          retention-days: 14

  # ------------------------------------------------------------------
  # 6) FOSSA license compliance.
  # ------------------------------------------------------------------
  fossa-license-scan:
    name: FOSSA license compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ secrets.FOSSA_API_KEY != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: FOSSA analyze + push
        uses: fossas/fossa-action@main
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        with:
          args: --config .fossa.yml
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: fossa-license
          path: fossa-licenses.sarif
          retention-days: 30

  fossa-license-skip:
    name: FOSSA license compliance (skip notice)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: ${{ secrets.FOSSA_API_KEY == '' }}
    steps:
      - name: Skip notice
        shell: bash
        run: |
          echo "::notice::FOSSA_API_KEY not configured; license compliance scan skipped. Add the secret to enable FOSSA."

  # ------------------------------------------------------------------
  # 7) SBOM per release — additional SPDX + CycloneDX artifacts.
  # ------------------------------------------------------------------
  sbom-release:
    name: Release SBOM (SPDX + CycloneDX)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      # Attestations require this for the GH-native SBOM attestation.
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Generate SBOM (Node)
        uses: anchore/sbom-action@fc46e51fd3cb168ffb36c6d1915723c47db58abb # v0.17.7
        with:
          format: spdx-json
          artifact-name: release-node-sbom.spdx.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-sbom
          path: release-node-sbom.spdx.json
          retention-days: 90
      - name: Native GH attestation for SBOM
        uses: actions/attest-sbom@0c7faa16a5d80eaf9c2b94da06c5be1c5af6b62b # v2.1.0
        with:
          subject-path: release-node-sbom.spdx.json

  # ------------------------------------------------------------------
  # 8) Container image signing (cosign keyless) — release tags only.
  # ------------------------------------------------------------------
  cosign-image-sign:
    name: cosign keyless image signing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0
        with:
          cosign-release: v2.4.1
      - name: Build & push image (skeleton — registries opt-in)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/sovereign-library:${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # No Dockerfile is committed yet; this job is a structural
          # placeholder so that the OIDC/signing plumbing is exercised on
          # every release tag. When GHCR publish is desired, replace the
          # body with `docker buildx build --push --tag "$IMAGE" .`.
          echo "::notice::Image build is structural-only; IMAGE=$IMAGE"
      - name: cosign sign (probe)
        env:
          COSIGN_EXPERIMENTAL: "1"
        shell: bash
        run: |
          set -euo pipefail
          # We exercise the signing path with a synthetic blob. Real image
          # signing is wired once the image build step is populated.
          echo "phase2 sign probe" > /tmp/probe.txt
          cosign sign-blob --yes --output-signature /tmp/probe.sig /tmp/probe.txt || \
            echo "::notice::cosign sign-blob probe returned non-zero — toolchain reachable but no public-network egress (expected on self-hosted runners)."

  # ------------------------------------------------------------------
  # 9) DAST — OWASP ZAP baseline scan (skeleton).
  # ------------------------------------------------------------------
  dast-zap-baseline:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ matrix.always }}
    strategy:
      fail-fast: false
      matrix:
        always: [false]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Pull ZAP image (probe)
        shell: bash
        run: |
          echo "::notice::DAST ZAP baseline is a skeleton: image pull + offline scan. Real target URL comes from a deployment."
      - name: Skip notice
        shell: bash
        run: echo "::notice::DAST skipped — no target URL configured for this repo (Sovereign releases are GitHub artifacts, not running services)."

  # ------------------------------------------------------------------
  # 10) API version / backward compat contract eval.
  # ------------------------------------------------------------------
  api-version-backcompat:
    name: API version + backward compat
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: API version check
        shell: bash
        run: |
          set -euo pipefail
          node scripts/api-version.mjs \
            --catalog "$PACKAGE_CATALOG" \
            --out "$PHASE2_OUTPUT_DIR/api-version.json"
      - name: Backward compat diff
        shell: bash
        run: |
          set -euo pipefail
          # Compare the public exports of every package in the catalog
          # against the previous release tag (if any).
          BASE="${BASE_REF:-main}"
          node scripts/backward-compat.mjs \
            --base-ref "$BASE" \
            --catalog "$PACKAGE_CATALOG" \
            --out "$PHASE2_OUTPUT_DIR/backcompat.json"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: api-version-backcompat
          path: ${{ env.PHASE2_OUTPUT_DIR }}/api-version.json
          retention-days: 30

  # ------------------------------------------------------------------
  # 11) Feature flag evaluation — contract check.
  # ------------------------------------------------------------------
  feature-flags-eval:
    name: Feature flag contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Feature flag contract eval
        shell: bash
        run: |
          set -euo pipefail
          node scripts/feature-flags.mjs \
            --flags ci/feature-flags/flags.json \
            --out "$PHASE2_OUTPUT_DIR/feature-flags.json"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: feature-flags
          path: ${{ env.PHASE2_OUTPUT_DIR }}/feature-flags.json
          retention-days: 30

  # ------------------------------------------------------------------
  # 12) Canary / progressive / blue-green / rollback — dry-run plan.
  # ------------------------------------------------------------------
  deploy-plan:
    name: Deploy plan (canary / blue-green / rollback)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Generate deploy plan
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deploy-plan.mjs \
            --strategy "${STRATEGY:-canary}" \
            --manifest ci/deploy/manifest.json \
            --out "$PHASE2_OUTPUT_DIR/deploy-plan.json"
      - name: Generate rollback plan
        shell: bash
        run: |
          set -euo pipefail
          node scripts/rollback.mjs \
            --manifest ci/deploy/manifest.json \
            --out "$PHASE2_OUTPUT_DIR/rollback.json"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: deploy-plan
          path: ${{ env.PHASE2_OUTPUT_DIR }}/deploy-plan.json
          retention-days: 30

  # ------------------------------------------------------------------
  # 13) Changelog + release notes auto-generation.
  # ------------------------------------------------------------------
  changelog-release-notes:
    name: Changelog + release notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Generate changelog preview
        shell: bash
        run: |
          set -euo pipefail
          node scripts/changelog.mjs \
            --since "${SINCE_REF:-HEAD~50}" \
            --until "HEAD" \
            --out "$PHASE2_OUTPUT_DIR/changelog.md"
      - name: Generate release notes preview
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-notes.mjs \
            --since "${SINCE_REF:-HEAD~50}" \
            --until "HEAD" \
            --template docs/RELEASE_NOTES_TEMPLATE.md \
            --out "$PHASE2_OUTPUT_DIR/release-notes.md"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: changelog-release-notes
          path: ${{ env.PHASE2_OUTPUT_DIR }}/changelog.md
          retention-days: 30

  # ------------------------------------------------------------------
  # 14) DB migration dry-run — schema versioner sanity check.
  # ------------------------------------------------------------------
  db-migrations:
    name: DB migration plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Migration dry-run
        shell: bash
        run: |
          set -euo pipefail
          node scripts/migrate.mjs \
            --migrations migrations/sqlite \
            --target "sqlite::memory:" \
            --dry-run \
            --out "$PHASE2_OUTPUT_DIR/migrations.json"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: migrations
          path: ${{ env.PHASE2_OUTPUT_DIR }}/migrations.json
          retention-days: 30

  # ------------------------------------------------------------------
  # 15) SBOM-per-release additional digest job.
  # ------------------------------------------------------------------
  sbom-digest:
    name: SBOM digest + CycloneDX
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Generate SBOM digest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-sbom.mjs \
            --input "$PACKAGE_CATALOG" \
            --out "$PHASE2_OUTPUT_DIR/sbom-digest.json"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sbom-digest
          path: ${{ env.PHASE2_OUTPUT_DIR }}/sbom-digest.json
          retention-days: 90

  # ------------------------------------------------------------------
  # 16) Final summary — aggregates all artifacts into a single index.
  # ------------------------------------------------------------------
  summary:
    name: Phase-2 summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - multi-region-ci
      - perf-regression
      - e2e-cloud
      - chaos-probes
      - fossa-license-skip
      - fossa-license-scan
      - api-version-backcompat
      - feature-flags-eval
      - deploy-plan
      - changelog-release-notes
      - db-migrations
      - sbom-digest
    if: always()
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Aggregate Phase-2 summary
        shell: bash
        run: |
          set -euo pipefail
          node scripts/phase2-summary.mjs \
            --run-id "$GITHUB_RUN_ID" \
            --sha "$GITHUB_SHA" \
            --ref "$GITHUB_REF" \
            --event "$GITHUB_EVENT_NAME" \
            --out "$PHASE2_OUTPUT_DIR/summary.json"
          echo "Phase-2 summary:"
          cat "$PHASE2_OUTPUT_DIR/summary.json"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: phase2-summary
          path: ${{ env.PHASE2_OUTPUT_DIR }}/summary.json
          retention-days: 90