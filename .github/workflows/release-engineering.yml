name: release-engineering

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, "feat/**"]
  workflow_dispatch:
    inputs:
      region:
        description: "Override the default multi-region CI region set"
        required: false
        type: choice
        options: [all, us-east, eu-west, asia-southeast]
        default: all

permissions:
  contents: read

env:
  PACKAGE_CATALOG: scripts/package-catalog.json
  PHASE2_OUTPUT_DIR: .hermes/phase2
  PHASE2_REGIONS_DEFAULT: "us-east,eu-west,asia-southeast"

concurrency:
  group: release-engineering-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  multi-region-ci:
    name: Multi-region CI (${{ matrix.region }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        region: [us-east, eu-west, asia-southeast]
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        node: ["24"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
      - name: Link browser cubes for in-repo Product resolution
        run: node scripts/link-browser-cubes.mjs
        shell: bash
      - name: Record region marker
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$PHASE2_OUTPUT_DIR/ci-region-${{ matrix.region }}-${{ matrix.os }}"
          printf '%s\n' "${{ matrix.region }}" > "$PHASE2_OUTPUT_DIR/ci-region-${{ matrix.region }}-${{ matrix.os }}/region.txt"
      - name: Bounded verify
        env:
          PHASE2_REGION: ${{ matrix.region }}
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run check
          node scripts/run-tests-bounded.mjs
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: region-${{ matrix.region }}-${{ matrix.os }}
          path: ${{ env.PHASE2_OUTPUT_DIR }}/ci-region-${{ matrix.region }}-${{ matrix.os }}/region.txt
          retention-days: 7

  perf-regression:
    name: Performance regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Run micro-benchmarks
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$PHASE2_OUTPUT_DIR"
          node scripts/perf-bench.mjs --out "$PHASE2_OUTPUT_DIR/perf-${{ matrix.os }}.json" --label "phase2-ci-${{ matrix.os }}"
      - name: Compare against pinned baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/perf-compare.mjs \
            --current "$PHASE2_OUTPUT_DIR/perf-${{ matrix.os }}.json" \
            --baseline ci/baselines/perf.baseline.json \
            --threshold 1.20 \
            --out "$PHASE2_OUTPUT_DIR/perf-${{ matrix.os }}.diff.json"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: perf-${{ matrix.os }}
          path: ${{ env.PHASE2_OUTPUT_DIR }}/perf-${{ matrix.os }}.diff.json
          if-no-files-found: warn
          retention-days: 14

  e2e-cloud:
    name: E2E (BrowserStack + SauceLabs)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: E2E (BrowserStack)
        if: ${{ env.BROWSERSTACK_USERNAME != '' && env.BROWSERSTACK_ACCESS_KEY != '' }}
        shell: bash
        run: node scripts/e2e-cloud.mjs --provider browserstack --out "$PHASE2_OUTPUT_DIR/e2e-browserstack.json"
      - name: E2E (SauceLabs)
        if: ${{ env.SAUCE_USERNAME != '' && env.SAUCE_ACCESS_KEY != '' }}
        shell: bash
        run: node scripts/e2e-cloud.mjs --provider saucelabs --out "$PHASE2_OUTPUT_DIR/e2e-saucelabs.json"
      - name: E2E skipped (no provider credentials)
        if: ${{ env.BROWSERSTACK_USERNAME == '' && env.SAUCE_USERNAME == '' }}
        shell: bash
        run: |
          mkdir -p "$PHASE2_OUTPUT_DIR"
          printf '%s\n' '{"skipped":true,"reason":"no provider credentials"}' > "$PHASE2_OUTPUT_DIR/e2e-skip.json"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: e2e-cloud
          path: ${{ env.PHASE2_OUTPUT_DIR }}/e2e-*.json
          if-no-files-found: warn
          retention-days: 14

  chaos-probes:
    name: Chaos engineering probes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Chaos probe suite
        shell: bash
        run: |
          set -Eeuo pipefail
          node scripts/chaos.mjs --suite ci/chaos/suite.json --out chaos.json
          test -s chaos.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: chaos
          path: chaos.json
          if-no-files-found: error
          retention-days: 14

  load-k6:
    name: Load test (k6)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: ${{ env.K6_CLOUD_TOKEN != '' }}
        with:
          persist-credentials: false
      - uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
        if: ${{ env.K6_CLOUD_TOKEN != '' }}
        with:
          k6-version: "1.8.0"
      - name: k6 run
        if: ${{ env.K6_CLOUD_TOKEN != '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$PHASE2_OUTPUT_DIR"
          k6 run --out cloud --out json="$PHASE2_OUTPUT_DIR/k6.json" ci/load/k6/smoke.js
      - name: k6 skipped (no token)
        if: ${{ env.K6_CLOUD_TOKEN == '' }}
        run: echo "::notice::K6_CLOUD_TOKEN not configured; k6 cloud load test skipped."
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: k6
          path: ${{ env.PHASE2_OUTPUT_DIR }}/k6.json
          if-no-files-found: warn
          retention-days: 14

  load-locust:
    name: Load test (Locust — disabled by default)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        enabled: [false]
    steps:
      - name: Disabled notice
        if: ${{ !matrix.enabled }}
        run: echo "::notice::Locust cloud-style load testing is disabled until a real target environment is configured."
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: matrix.enabled
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        if: matrix.enabled
        with:
          python-version: "3.12"
      - name: Locust smoke
        if: matrix.enabled
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --quiet locust==2.31.8
          mkdir -p "$PHASE2_OUTPUT_DIR"
          locust -f ci/load/locustfile.py --headless -u 1 -r 1 -t 30s --host http://127.0.0.1:65535 --csv "$PHASE2_OUTPUT_DIR/locust"

  fossa-license:
    name: FOSSA license compliance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: FOSSA analyze + push
        if: ${{ env.FOSSA_API_KEY != '' }}
        uses: fossas/fossa-action@main
        with:
          args: --config .fossa.yml
      - name: FOSSA skipped (no API key)
        if: ${{ env.FOSSA_API_KEY == '' }}
        run: echo "::notice::FOSSA_API_KEY not configured; license compliance scan skipped."

  api-version-backcompat:
    name: API version + backward compat
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: API version check
        shell: bash
        run: node scripts/api-version.mjs --catalog "$PACKAGE_CATALOG" --out "$PHASE2_OUTPUT_DIR/api-version.json"
      - name: Backward compat diff
        shell: bash
        run: node scripts/backward-compat.mjs --base-ref main --catalog "$PACKAGE_CATALOG" --out "$PHASE2_OUTPUT_DIR/backcompat.json"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: api-version-backcompat
          path: ${{ env.PHASE2_OUTPUT_DIR }}/api-version.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  feature-flags-eval:
    name: Feature flag contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Feature flag contract eval
        shell: bash
        run: node scripts/feature-flags.mjs --flags ci/feature-flags/flags.json --out "$PHASE2_OUTPUT_DIR/feature-flags.json"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: feature-flags
          path: ${{ env.PHASE2_OUTPUT_DIR }}/feature-flags.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  deploy-plan:
    name: Deploy plan (canary / blue-green / rollback)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Generate deploy plan
        shell: bash
        run: |
          node scripts/deploy-plan.mjs --strategy canary --manifest ci/deploy/manifest.json --out "$PHASE2_OUTPUT_DIR/deploy-plan.json"
          node scripts/rollback.mjs --manifest ci/deploy/manifest.json --out "$PHASE2_OUTPUT_DIR/rollback.json"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: deploy-plan
          path: ${{ env.PHASE2_OUTPUT_DIR }}/deploy-plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  changelog-release-notes:
    name: Changelog + release notes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Generate previews
        shell: bash
        run: |
          node scripts/changelog.mjs --since "${SINCE_REF:-HEAD~50}" --until HEAD --out "$PHASE2_OUTPUT_DIR/changelog.md"
          node scripts/release-notes.mjs --since "${SINCE_REF:-HEAD~50}" --until HEAD --template docs/RELEASE_NOTES_TEMPLATE.md --out "$PHASE2_OUTPUT_DIR/release-notes.md"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: changelog-release-notes
          path: ${{ env.PHASE2_OUTPUT_DIR }}/changelog.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  db-migrations:
    name: DB migration plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Migration dry-run
        shell: bash
        run: node scripts/migrate.mjs --migrations migrations/sqlite --target "sqlite::memory:" --dry-run --out "$PHASE2_OUTPUT_DIR/migrations.json"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: migrations
          path: ${{ env.PHASE2_OUTPUT_DIR }}/migrations.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  sbom-release:
    name: Release SBOM (tag only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Generate SBOM
        uses: anchore/sbom-action@fc46e51fd3cb168ffb36c6d1915723c47db58abb # v0.17.7
        with:
          format: spdx-json
          artifact-name: release-node-sbom.spdx.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: release-sbom
          path: release-node-sbom.spdx.json
          if-no-files-found: error
          retention-days: 90
      - name: Native GH SBOM attestation
        uses: actions/attest-sbom@0c7faa16a5d80eaf9c2b94da06c5be1c5af6b62b # v2.1.0
        with:
          subject-path: release-node-sbom.spdx.json

  sbom-digest:
    name: SBOM digest (tag only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Generate SBOM digest
        shell: bash
        run: node scripts/generate-sbom.mjs --input "$PACKAGE_CATALOG" --out "$PHASE2_OUTPUT_DIR/sbom-digest.json"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: sbom-digest
          path: ${{ env.PHASE2_OUTPUT_DIR }}/sbom-digest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  cosign-image-sign:
    name: cosign keyless signing probe (tag only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20 # v3.5.0
        with:
          cosign-release: v2.4.1
      - name: Sign synthetic probe
        env:
          COSIGN_EXPERIMENTAL: "1"
        shell: bash
        run: |
          set +e
          printf '%s\n' 'phase2 sign probe' > /tmp/probe.txt
          cosign sign-blob --yes --output-signature /tmp/probe.sig /tmp/probe.txt
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::notice::cosign keyless exchange did not complete (exit $rc); toolchain and workflow wiring were exercised."
          fi

  dast-zap-baseline:
    name: DAST placeholder (disabled)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "::notice::DAST is disabled until a deployed target URL exists; no target is silently fabricated."

  summary:
    name: Phase-2 summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - multi-region-ci
      - perf-regression
      - e2e-cloud
      - chaos-probes
      - load-k6
      - load-locust
      - fossa-license
      - api-version-backcompat
      - feature-flags-eval
      - deploy-plan
      - changelog-release-notes
      - db-migrations
      - sbom-release
      - sbom-digest
      - cosign-image-sign
      - dast-zap-baseline
    if: always()
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Aggregate Phase-2 summary
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$PHASE2_OUTPUT_DIR"
          node scripts/phase2-summary.mjs --run-id "$GITHUB_RUN_ID" --sha "$GITHUB_SHA" --ref "$GITHUB_REF" --event "$GITHUB_EVENT_NAME" --out "$PHASE2_OUTPUT_DIR/summary.json"
          cat "$PHASE2_OUTPUT_DIR/summary.json"
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        if: always()
        with:
          name: phase2-summary
          path: ${{ env.PHASE2_OUTPUT_DIR }}/summary.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
