[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sovereign-digest"
version = "0.1.0"
description = "Native Python implementation of the DIG1 digest contract (Sovereign Library). Dependency-free SHA-256/512, HMAC, constant-time compare, streamed async hashing."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Sovereign Library" }]
keywords = ["sovereign", "digest", "hash", "sha256", "sha512", "hmac", "crypto"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/sovereign_digest"]

[tool.hatch.build.targets.sdist]
include = ["src/sovereign_digest", "README.md", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
