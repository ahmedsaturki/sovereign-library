[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sovereign-runtime-capability-inspector"
version = "0.1.0"
description = "Native Python implementation of the RCI1 runtime-capability-inspector contract (Sovereign Library). Dependency-free runtime capability snapshot and requirement evaluation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Sovereign Library" }]
keywords = ["sovereign", "runtime", "capability", "platform", "inspect"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/sovereign_runtime_capability_inspector"]

[tool.hatch.build.targets.sdist]
include = ["src/sovereign_runtime_capability_inspector", "README.md", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
