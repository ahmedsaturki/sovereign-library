[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sovereign-circuit-breaker"
version = "0.1.0"
description = "Native Python implementation of the Sovereign Circuit Breaker contract."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Sovereign Library" }]
keywords = ["sovereign", "circuit-breaker", "resilience", "retry", "fault-tolerance"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/sovereign_circuit_breaker"]

[tool.hatch.build.targets.sdist]
include = ["src/sovereign_circuit_breaker", "README.md", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
