[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sovereign-canonical-json"
version = "0.1.0"
description = "Native Python implementation of the CJSON1 canonical-json contract (Sovereign Library). Dependency-free deterministic canonical JSON normalization and serialization."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Sovereign Library" }]
keywords = ["sovereign", "json", "canonical", "deterministic", "serialization"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/sovereign_canonical_json"]

[tool.hatch.build.targets.sdist]
include = ["src/sovereign_canonical_json", "README.md", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
