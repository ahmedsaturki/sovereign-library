[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sovereign-cache"
version = "0.1.0"
description = "Native Python implementation of the CACH1 cache contract (Sovereign Library). Dependency-free TTL cache with single-flight async getOrCompute and hit/miss/eviction stats."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Sovereign Library" }]
keywords = ["sovereign", "cache", "ttl", "memoize", "single-flight"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.21"]

[tool.hatch.build.targets.wheel]
packages = ["src/sovereign_cache"]

[tool.hatch.build.targets.sdist]
include = ["src/sovereign_cache", "README.md", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
