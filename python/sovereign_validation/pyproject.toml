[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sovereign-validation"
version = "0.1.0"
description = "Native Python implementation of the VAL1 validation contract (Sovereign Library). Dependency-free schema validation: parse/safeParse, type/enum/literal/length/pattern/range/shape/unknownKeys, custom validate."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Sovereign Library" }]
keywords = ["sovereign", "validation", "schema", "parse"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/sovereign_validation"]

[tool.hatch.build.targets.sdist]
include = ["src/sovereign_validation", "README.md", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
