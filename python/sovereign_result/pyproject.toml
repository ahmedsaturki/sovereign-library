[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sovereign-result"
version = "0.1.0"
description = "Native Python implementation of the RES1 result contract (Sovereign Library). Dependency-free Result/error wrapper with fail-closed snapshots."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Sovereign Library" }]
keywords = ["sovereign", "result", "error", "monad", "functional"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["src/sovereign_result"]

[tool.hatch.build.targets.sdist]
include = ["src/sovereign_result", "README.md", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
