# Sovereign Sonar configuration.
# Used by `sonar-scanner` against an external SonarQube server.
# Local analysis is opt-in; CI integration lives under
# .github/workflows/codeql.yml.

sonar.projectKey=sovereign-library
sonar.projectName=Sovereign Library
sonar.projectVersion=0.1.0

sonar.sources=cubes,products,scripts
sonar.tests=cubes,products,tests,specs
sonar.exclusions=**/node_modules/**,**/.git/**,**/dist/**

sonar.javascript.file.suffixes=.js,.mjs

sonar.sourceEncoding=UTF-8
sonar.language=js

# Quality gate thresholds
sonar.qualitygate.wait=true

# Rule exclusions (Sovereign-allowed)
# - Allow `console.log` in scripts (used for CLI feedback)
sonar.exclusions=scripts/**